<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>پنل مدیریت آرا</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .adm { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
    .side { background: #13201c; color: #fffdf9; padding: 22px 16px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
    .side .brand { margin-bottom: 18px; color: #fffdf9; }
    .side .brand small { color: rgba(255,253,249,.6); }
    .side button { text-align: start; padding: 11px 14px; border-radius: 12px; font-weight: 600; color: rgba(255,253,249,.75); display: flex; justify-content: space-between; align-items: center; }
    .side button:hover { background: rgba(255,255,255,.06); color: #fff; }
    .side button.is-on { background: rgba(255,255,255,.1); color: #fff; }
    .side .badge { background: #df5a2c; color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; min-width: 20px; text-align: center; }
    .side__foot { margin-top: auto; display: grid; gap: 6px; font-size: 13px; }
    .side__foot a { color: rgba(255,253,249,.75); padding: 8px 14px; }
    .main { padding: 28px 32px 60px; max-width: 1180px; }
    .main h1 { font-size: 26px; font-weight: 900; margin-bottom: 4px; }
    .main > p.muted { margin-bottom: 22px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; margin-bottom: 18px; }
    .panel h2 { font-size: 17px; font-weight: 800; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .kpis div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
    .kpis b { display: block; font-size: 26px; font-weight: 900; }
    .kpis span { font-size: 12.5px; color: var(--muted); }
    .status { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: var(--r); background: var(--sunk); font-size: 14px; flex-wrap: wrap; }
    .status i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
    .status.on i { background: #22a06b; box-shadow: 0 0 0 4px rgba(34,160,107,.2); }
    .status.err i { background: var(--over); }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .tbl th, .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
    .tbl th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
    .tbl-scroll { overflow-x: auto; max-height: 460px; overflow-y: auto; }
    .ok { color: var(--great); } .bad { color: var(--over); }
    .checks { display: flex; flex-wrap: wrap; gap: 6px; }
    .checks label { cursor: pointer; }
    .checks input { position: absolute; opacity: 0; pointer-events: none; }
    .checks span { display: inline-block; padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 13px; font-weight: 600; }
    .checks input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .checks input:focus-visible + span { outline: 2px solid var(--narenj); }
    .switch { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 700; }
    .switch input { position: absolute; opacity: 0; }
    .switch i { width: 48px; height: 28px; border-radius: 14px; background: var(--line-2); position: relative; transition: .2s; }
    .switch i::after { content: ""; position: absolute; top: 4px; inset-inline-start: 4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .switch input:checked + i { background: #22a06b; }
    .switch input:checked + i::after { inset-inline-start: 24px; }
    .hint { font-size: 12.5px; color: var(--muted); line-height: 1.8; margin-top: 6px; }
    .note { background: var(--narenj-soft); color: var(--ink); border-radius: var(--r); padding: 12px 16px; font-size: 13.5px; line-height: 1.9; }
    .progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; min-width: 80px; }
    .progress i { display: block; height: 100%; background: var(--forest); }
    pre.raw { background: var(--sunk); padding: 12px; border-radius: 10px; font-size: 12px; direction: ltr; text-align: left; max-height: 260px; overflow: auto; white-space: pre-wrap; }
    .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login form { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 30px; display: grid; gap: 14px; box-shadow: var(--shadow-3); }
    .svc-row { display: grid; grid-template-columns: 1.2fr .8fr 1.5fr auto; gap: 8px; margin-bottom: 8px; }
    .sec { display: none; } .sec.is-on { display: block; }
    @media (max-width: 900px) {
      .adm { grid-template-columns: 1fr; }
      .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; }
      .side .brand { width: 100%; margin-bottom: 6px; }
      .side__foot { display: none; }
      .main { padding: 20px 16px 60px; }
      .grid2, .grid3, .kpis { grid-template-columns: 1fr 1fr; }
      .svc-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="assets/js/admin.js"></script>
</body>
</html>
