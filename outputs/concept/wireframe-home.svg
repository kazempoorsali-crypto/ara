<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2570" viewBox="0 0 1200 2570" direction="rtl">
<rect width="1200" height="2570" fill="#f4f1ea"/>
<text x="1140" y="50" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="30" font-weight="700" fill="#12211d">وایرفریم صفحهٔ اصلی فرصت ملک (کانسپت پیشنهادی)</text>
<rect x="60" y="80" width="1080" height="100" rx="22" fill="#1b2a24"/>
<text x="1110" y="122" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f4efe6">۱. سربرگ شیشه‌ای</text>
<text x="1110" y="158" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#b9c7bf">لوگو · فرصت‌ها · بازار محله‌ها · روش · پشتیبانی · ورود</text>
<rect x="60" y="220" width="1080" height="420" rx="22" fill="#0f1c18"/>
<text x="1110" y="262" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f4efe6">۲. قهرمان تمام‌صفحه (Hero)</text>
<text x="1110" y="298" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#b9c7bf">ویدئوی سینمایی شب شهر + تیتر برند + جست‌وجوی هوشمند + کرهٔ زندهٔ بازار</text>
<rect x="90" y="330" width="430" height="280" rx="20" fill="#0b1411" stroke="#4fd39a" stroke-opacity=".5"/>
<circle cx="305" cy="470" r="105" fill="#14303a" stroke="#4fd39a" stroke-width="2"/>
<text x="305" y="475" text-anchor="middle" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#cfeee0">کرهٔ زندهٔ بازار</text>
<rect x="600" y="520" width="510" height="70" rx="35" fill="#f4efe6"/>
<text x="1080" y="563" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#12211d">جست‌وجوی هوشمند: منطقه · بودجه · متراژ · هدف خرید</text>
<text x="1110" y="380" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="40" font-weight="700" fill="#f4efe6">فرصت ملک</text>
<text x="1110" y="425" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="22" font-weight="400" fill="#d9c9a3">فراتر از یک معامله؛ همراه شما در تصمیم‌های بزرگ ملکی</text>
<rect x="60" y="680" width="1080" height="100" rx="22" fill="#16241f"/>
<text x="1110" y="722" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f4efe6">۳. نوار اعتبار داده</text>
<text x="1110" y="758" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#b9c7bf">آگهی سنجیده‌شده · فرصت زیر قیمت · محلهٔ پوشش‌داده · دقت برآورد (همه از دادهٔ واقعی)</text>
<rect x="60" y="820" width="1080" height="150" rx="22" fill="#1b2a24"/>
<text x="1110" y="862" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f4efe6">۴. مانیفست برند</text>
<text x="1110" y="898" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#b9c7bf">«انتخاب یک ملک، انتخاب آینده است» — متن کوتاه با آشکارشدن کلمه‌به‌کلمه هنگام اسکرول</text>
<rect x="60" y="1010" width="1080" height="300" rx="22" fill="#0f1c18"/>
<text x="1110" y="1052" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f4efe6">۵. فرصت‌های منتخب، مثل پروژهٔ معماری</text>
<text x="1110" y="1088" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#b9c7bf">پیمایش افقی سنجاق‌شده؛ تصویر بزرگ، نام محله، متراژ، فاصله با قیمت محله</text>
<rect x="870" y="1110" width="240" height="170" rx="16" fill="#26403a"/>
<text x="1095" y="1260" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#f4efe6">پروژهٔ نخست</text>
<rect x="608" y="1110" width="240" height="170" rx="16" fill="#26403a"/>
<text x="833" y="1260" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#f4efe6">پروژهٔ دوم</text>
<rect x="346" y="1110" width="240" height="170" rx="16" fill="#26403a"/>
<text x="571" y="1260" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#f4efe6">پروژهٔ سوم</text>
<rect x="84" y="1110" width="240" height="170" rx="16" fill="#26403a"/>
<text x="309" y="1260" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#f4efe6">پروژهٔ چهارم</text>
<rect x="60" y="1350" width="1080" height="260" rx="22" fill="#16241f"/>
<text x="1110" y="1392" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f4efe6">۶. هوش محله</text>
<text x="1110" y="1428" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#b9c7bf">نقشهٔ واقعی + ستون سه‌بعدی قیمت هر محله + مقایسه با محله‌های مجاور</text>
<rect x="90" y="1450" width="1020" height="140" rx="16" fill="#0b1411"/>
<rect x="200" y="1515" width="16" height="60" rx="3" fill="#5e7a70"/>
<rect x="330" y="1480" width="16" height="95" rx="3" fill="#3ccf8e"/>
<rect x="460" y="1535" width="16" height="40" rx="3" fill="#5e7a70"/>
<rect x="590" y="1465" width="16" height="110" rx="3" fill="#3ccf8e"/>
<rect x="720" y="1505" width="16" height="70" rx="3" fill="#5e7a70"/>
<rect x="850" y="1525" width="16" height="50" rx="3" fill="#5e7a70"/>
<rect x="980" y="1490" width="16" height="85" rx="3" fill="#3ccf8e"/>
<rect x="60" y="1650" width="1080" height="220" rx="22" fill="#1b2a24"/>
<text x="1110" y="1692" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f4efe6">۷. روش و اعتماد</text>
<text x="1110" y="1728" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#b9c7bf">چهار گام ارزش‌گذاری، دقت بیرون از نمونه، ضد تبانی و ضد قیمت‌سازی</text>
<rect x="875" y="1755" width="235" height="90" rx="14" fill="#26403a"/>
<text x="1090" y="1808" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#f4efe6">۱. گردآوری</text>
<rect x="620" y="1755" width="235" height="90" rx="14" fill="#26403a"/>
<text x="835" y="1808" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#f4efe6">۲. پاک‌سازی</text>
<rect x="365" y="1755" width="235" height="90" rx="14" fill="#26403a"/>
<text x="580" y="1808" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#f4efe6">۳. قیمت محله</text>
<rect x="110" y="1755" width="235" height="90" rx="14" fill="#26403a"/>
<text x="325" y="1808" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#f4efe6">۴. حکم و امتیاز</text>
<rect x="60" y="1910" width="1080" height="180" rx="22" fill="#0f1c18"/>
<text x="1110" y="1952" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f4efe6">۸. مشاوره و هدف خرید</text>
<text x="1110" y="1988" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#b9c7bf">سکونت · سرمایه‌گذاری · اجاره‌داری — فرم سه‌مرحله‌ای</text>
<rect x="910" y="2015" width="200" height="50" rx="25" fill="#f4efe6"/>
<text x="1010" y="2047" text-anchor="middle" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#12211d">سکونت</text>
<rect x="690" y="2015" width="200" height="50" rx="25" fill="#f4efe6"/>
<text x="790" y="2047" text-anchor="middle" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#12211d">سرمایه‌گذاری</text>
<rect x="470" y="2015" width="200" height="50" rx="25" fill="#f4efe6"/>
<text x="570" y="2047" text-anchor="middle" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#12211d">اجاره‌داری</text>
<rect x="60" y="2130" width="1080" height="220" rx="22" fill="#16241f"/>
<text x="1110" y="2172" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f4efe6">۹. تحلیل‌ها و راهنماها</text>
<text x="1110" y="2208" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#b9c7bf">مقاله‌های بازار شهرها، چک‌لیست خرید و پیش‌فروش</text>
<rect x="790" y="2230" width="320" height="95" rx="14" fill="#26403a"/>
<text x="1090" y="2285" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#f4efe6">مقالهٔ نخست</text>
<rect x="445" y="2230" width="320" height="95" rx="14" fill="#26403a"/>
<text x="745" y="2285" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#f4efe6">مقالهٔ دوم</text>
<rect x="100" y="2230" width="320" height="95" rx="14" fill="#26403a"/>
<text x="400" y="2285" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#f4efe6">مقالهٔ سوم</text>
<rect x="60" y="2390" width="1080" height="100" rx="22" fill="#1b2a24"/>
<text x="1110" y="2432" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f4efe6">۱۰. پانویس</text>
<text x="1110" y="2468" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#b9c7bf">پیوندها، نمادهای اعتماد، تماس</text>
</svg>