<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2210" viewBox="0 0 1200 2210" direction="rtl">
<rect width="1200" height="2210" fill="#f6f3ee"/>
<text x="1140" y="50" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="30" font-weight="700" fill="#151614">وایرفریم صفحهٔ اصلی — کانسپت هوش ملکی لوکس (نسخهٔ ۲)</text>
<rect x="60" y="80" width="1080" height="360" rx="22" fill="#141513"/>
<text x="1110" y="122" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f6f3ee">۱. قهرمان</text>
<text x="1110" y="158" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#bdb6a8">تیتر «هر ملک یک قیمت دارد؛ ما ارزش واقعی آن را پیدا می‌کنیم» + دو دکمه + جست‌وجو (راست) + کرهٔ زنده (چپ)</text>
<rect x="90" y="180" width="420" height="230" rx="20" fill="#0f1a16" stroke="#3ccf8e" stroke-opacity=".5"/>
<circle cx="300" cy="295" r="85" fill="#14303a" stroke="#3ccf8e" stroke-width="2"/>
<text x="300" y="300" text-anchor="middle" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#cfeee0">کرهٔ زنده</text>
<rect x="590" y="330" width="520" height="70" rx="20" fill="#f6f3ee"/>
<text x="1090" y="373" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#151614">جست‌وجو: استان · شهر · محله · جملهٔ آزاد</text>
<rect x="980" y="260" width="130" height="44" rx="22" fill="#b8955a"/>
<text x="1045" y="288" text-anchor="middle" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="15" font-weight="400" fill="#151614">ارزیابی یک ملک</text>
<rect x="800" y="260" width="170" height="44" rx="22" fill="none" stroke="#bdb6a8"/>
<text x="885" y="288" text-anchor="middle" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="15" font-weight="400" fill="#f6f3ee">مشاهدهٔ فرصت‌ها</text>
<rect x="60" y="474" width="1080" height="170" rx="22" fill="#1d1e1b"/>
<text x="1110" y="516" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f6f3ee">۲. مشکل بازار</text>
<text x="1110" y="552" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#bdb6a8">«قیمت اعلام‌شده، همیشه ارزش واقعی نیست» + چهار دلیل</text>
<rect x="870" y="574" width="240" height="50" rx="12" fill="#2a2b27"/>
<text x="1095" y="606" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#f6f3ee">قیمت مالک</text>
<rect x="608" y="574" width="240" height="50" rx="12" fill="#2a2b27"/>
<text x="833" y="606" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#f6f3ee">قیمت مشاور</text>
<rect x="346" y="574" width="240" height="50" rx="12" fill="#2a2b27"/>
<text x="571" y="606" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#f6f3ee">قیمت آگهی</text>
<rect x="84" y="574" width="240" height="50" rx="12" fill="#2a2b27"/>
<text x="309" y="606" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#f6f3ee">مقایسهٔ دستی</text>
<rect x="60" y="678" width="1080" height="130" rx="22" fill="#141513"/>
<text x="1110" y="720" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f6f3ee">۳. راه‌حل</text>
<text x="1110" y="756" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#bdb6a8">«لایهٔ هوشمند تحلیل، پیش از خرید» — جایگزین مشاور نیستیم</text>
<rect x="60" y="842" width="1080" height="220" rx="22" fill="#1d1e1b"/>
<text x="1110" y="884" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f6f3ee">۴. نمونهٔ تحلیل ارزش</text>
<text x="1110" y="920" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#bdb6a8">قیمت پیشنهادی · ارزش تخمینی بازار · نتیجهٔ پنج‌سطحی · امتیاز فرصت (از دادهٔ واقعی)</text>
<rect x="90" y="937" width="520" height="105" rx="16" fill="#26271f"/>
<text x="590" y="972" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#f6f3ee">قیمت پیشنهادی · ارزش تخمینی</text>
<text x="590" y="1007" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#3ccf8e">فرصت طلایی — ۲۲٪ زیر ارزش</text>
<path d="M700 1032 a90 90 0 0 1 180 0" fill="none" stroke="#b8955a" stroke-width="12"/>
<text x="790" y="1022" text-anchor="middle" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="18" font-weight="400" fill="#d4b46a">امتیاز ۹۲</text>
<rect x="60" y="1096" width="1080" height="110" rx="22" fill="#141513"/>
<text x="1110" y="1138" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f6f3ee">۵. جست‌وجوی هوشمند</text>
<text x="1110" y="1174" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#bdb6a8">جملهٔ آزاد + منطقه · بودجه · متراژ · نوع · هدف خرید (در قهرمان ادغام شده)</text>
<rect x="60" y="1240" width="1080" height="220" rx="22" fill="#1d1e1b"/>
<text x="1110" y="1282" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f6f3ee">۶. فرصت‌های طلایی بازار</text>
<text x="1110" y="1318" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#bdb6a8">منطقه · قیمت واقعی · قیمت پیشنهادی · درصد فرصت · امتیاز</text>
<rect x="870" y="1340" width="240" height="100" rx="14" fill="#2a2b27"/>
<text x="1095" y="1370" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="14" font-weight="400" fill="#bdb6a8">محله · متراژ</text>
<text x="1095" y="1400" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#3ccf8e">۲۵٪ زیر ارزش</text>
<text x="1095" y="1427" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="14" font-weight="400" fill="#d4b46a">امتیاز ۹۰</text>
<rect x="608" y="1340" width="240" height="100" rx="14" fill="#2a2b27"/>
<text x="833" y="1370" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="14" font-weight="400" fill="#bdb6a8">محله · متراژ</text>
<text x="833" y="1400" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#3ccf8e">۲۵٪ زیر ارزش</text>
<text x="833" y="1427" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="14" font-weight="400" fill="#d4b46a">امتیاز ۹۰</text>
<rect x="346" y="1340" width="240" height="100" rx="14" fill="#2a2b27"/>
<text x="571" y="1370" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="14" font-weight="400" fill="#bdb6a8">محله · متراژ</text>
<text x="571" y="1400" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#3ccf8e">۲۵٪ زیر ارزش</text>
<text x="571" y="1427" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="14" font-weight="400" fill="#d4b46a">امتیاز ۹۰</text>
<rect x="84" y="1340" width="240" height="100" rx="14" fill="#2a2b27"/>
<text x="309" y="1370" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="14" font-weight="400" fill="#bdb6a8">محله · متراژ</text>
<text x="309" y="1400" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="16" font-weight="400" fill="#3ccf8e">۲۵٪ زیر ارزش</text>
<text x="309" y="1427" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="14" font-weight="400" fill="#d4b46a">امتیاز ۹۰</text>
<rect x="60" y="1494" width="1080" height="170" rx="22" fill="#141513"/>
<text x="1110" y="1536" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f6f3ee">۷. تحلیل مناطق و محله‌ها</text>
<text x="1110" y="1572" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#bdb6a8">نقشهٔ زنده + قیمت هر محله + راهنمای استان‌ها در یک ردیف</text>
<rect x="220" y="1594" width="16" height="50" rx="3" fill="#77746c"/>
<rect x="360" y="1559" width="16" height="85" rx="3" fill="#3ccf8e"/>
<rect x="500" y="1609" width="16" height="35" rx="3" fill="#77746c"/>
<rect x="640" y="1549" width="16" height="95" rx="3" fill="#3ccf8e"/>
<rect x="780" y="1584" width="16" height="60" rx="3" fill="#77746c"/>
<rect x="920" y="1599" width="16" height="45" rx="3" fill="#77746c"/>
<rect x="60" y="1698" width="1080" height="130" rx="22" fill="#1d1e1b"/>
<text x="1110" y="1740" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f6f3ee">۸. روش ارزش‌گذاری</text>
<text x="1110" y="1776" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#bdb6a8">چهار گام، ضد تبانی، ضد قیمت‌سازی، دقت سنجیده‌شده</text>
<rect x="60" y="1862" width="1080" height="130" rx="22" fill="#141513"/>
<text x="1110" y="1904" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f6f3ee">۹. اعتمادسازی</text>
<text x="1110" y="1940" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#bdb6a8">مستقل، بدون کمیسیون، هر عدد با دلیل، دقت قابل وارسی</text>
<rect x="60" y="2026" width="1080" height="120" rx="22" fill="#1d1e1b"/>
<text x="1110" y="2068" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="24" font-weight="700" fill="#f6f3ee">۱۰. درخواست مشاوره</text>
<text x="1110" y="2104" text-anchor="start" font-family="B Nazanin, Vazirmatn, Tahoma" font-size="17" font-weight="400" fill="#bdb6a8">سکونت · سرمایه‌گذاری · اجاره‌داری</text>
</svg>